# Critic Harness configuration
version: "1.0"

# Model defaults
model:
  provider: fixture          # fixture | anthropic | openai
  name: claude-sonnet-4-5
  max_tokens: 1400

# Repair loop
loop:
  bound: 2                   # max repairs before terminal ESCALATE

# Paths (relative to repo root)
paths:
  prompt: prompt/critic.v1.0.md
  index: corpus/index.sample.json
  suite: suite/v1.0.json
  log: logs/runs.jsonl

# Policy overrides (rarely needed)
policy:
  evidence_floor:
    0: 1
    1: 1
    2: 1
    3: 2
    4: 3
    5: 2
  level4_required_chapters: [15, 16, 21]
